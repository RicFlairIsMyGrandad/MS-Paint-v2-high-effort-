name: Windows packaged application checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'desktop/**'
      - 'public/**'
      - 'tests/**'
      - 'tools/packaged-qa.mjs'
      - 'tools/portable-windows-qa.cjs'
      - 'tools/publish-windows-evidence.cjs'
      - 'tools/use-release-candidate.cjs'
      - 'package*.json'
      - 'vite.config.mjs'
      - 'playwright.config.mjs'
      - 'index.html'
      - '.github/workflows/windows-check.yml'
permissions:
  contents: write
concurrency:
  group: paintplus-windows-check
  cancel-in-progress: true
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PAINTPLUS_CI_TARGET: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Core and resource tests
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -FilePath windows-core-tests.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { Get-Content windows-core-tests.log | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append }
          exit $testExit
      - run: npx playwright install chromium
      - name: UI regressions
        shell: pwsh
        run: |
          npm run test:ui 2>&1 | Tee-Object -FilePath windows-ui-tests.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { Get-Content windows-ui-tests.log | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append }
          exit $testExit
      - name: Build the Windows installer and portable application
        shell: pwsh
        run: |
          npm run package:win 2>&1 | Tee-Object -FilePath windows-build-tests.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { Get-Content windows-build-tests.log | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append }
          exit $testExit
      - name: Use matching published release candidate when available
        run: node tools/use-release-candidate.cjs
      - name: Install the actual setup silently
        shell: pwsh
        run: |
          $paintVersion = (Get-Content package.json | ConvertFrom-Json).version
          $setupFile = (Resolve-Path "release/PaintPlus-Setup-$paintVersion-x64.exe").Path
          $setupProcess = Start-Process -FilePath $setupFile -ArgumentList '/S' -Wait -PassThru
          if ($setupProcess.ExitCode -ne 0) { throw "Setup failed: $($setupProcess.ExitCode)" }
          $installedExe = "$env:LOCALAPPDATA\Programs\PaintPlus\PaintPlus.exe"
          if (!(Test-Path $installedExe)) { throw 'Installed executable is missing' }
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) 'PaintPlus.lnk'
          $startShortcut = Join-Path ([Environment]::GetFolderPath('StartMenu')) 'Programs\PaintPlus\PaintPlus.lnk'
          $shell = New-Object -ComObject WScript.Shell
          foreach ($shortcut in @($desktopShortcut, $startShortcut)) {
            if (!(Test-Path $shortcut)) { throw "Missing shortcut: $shortcut" }
            if ($shell.CreateShortcut($shortcut).TargetPath -ne $installedExe) { throw "Incorrect shortcut: $shortcut" }
          }
          $association = (Get-Item 'Registry::HKEY_CURRENT_USER\Software\Classes\PaintPlus.Project\shell\open\command').GetValue('')
          if ($association -ne "`"$installedExe`" `"%1`"") { throw 'Incorrect project association command' }
          @{ setupExitCode = $setupProcess.ExitCode; payloadPresent = $true; desktopShortcut = $true; startMenuShortcut = $true; projectAssociationCommand = $true } | ConvertTo-Json | Out-File docs/windows-install-test-results.json
          "PAINTPLUS_TEST_EXECUTABLE=$installedExe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Packaged Windows startup, drawing, clipboard and AI
        shell: pwsh
        run: |
          node tools/packaged-qa.mjs 2>&1 | Tee-Object -FilePath windows-packaged-tests.log
          $testExit = $LASTEXITCODE
          Get-Content windows-packaged-tests.log | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          exit $testExit
      - name: Launch the actual portable executable
        run: node tools/portable-windows-qa.cjs
      - name: Uninstall and preserve a user project
        if: always()
        shell: pwsh
        run: |
          $appDirectory = "$env:LOCALAPPDATA\Programs\PaintPlus"
          $uninstaller = "$appDirectory\Uninstall PaintPlus.exe"
          if (Test-Path $uninstaller) {
            'preserve this user file' | Out-File "$appDirectory\Preserve-test.paintplus"
            $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
            Start-Sleep -Seconds 2
            if (Test-Path "$appDirectory\PaintPlus.exe") { throw 'Application remains after uninstall' }
            if (!(Test-Path "$appDirectory\Preserve-test.paintplus")) { throw 'Uninstall removed user project' }
            if (Test-Path "$appDirectory\resources\elevate.exe") { throw 'Uninstall retained shipped helper' }
            if (Test-Path 'Registry::HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Uninstall\PaintPlus') { throw 'Uninstall retained registry entry' }
            @{ applicationRemoved = $true; userProjectPreserved = $true; shippedHelperRemoved = $true; uninstallEntryRemoved = $true } | ConvertTo-Json | Out-File docs/windows-uninstall-test-results.json
            'Installer execution, installed payload, uninstall and user-file retention passed.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-check-evidence-${{ matrix.os }}
          path: |
            docs/ui-test-results.json
            docs/packaged-windows-test-results.json
            docs/portable-windows-test-results.json
            docs/windows-install-test-results.json
            docs/windows-uninstall-test-results.json
            docs/windows-release-candidate.json
            docs/screenshots/packaged-windows.png
            docs/screenshots/packaged-windows-dialog.png
            docs/screenshots/packaged-windows-text.png
            test-results/
            windows-*-tests.log
          retention-days: 14
      - name: Publish isolated Windows test evidence
        if: always()
        run: node tools/publish-windows-evidence.cjs
