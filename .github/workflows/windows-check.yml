name: Windows packaged application checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'desktop/**'
      - 'public/**'
      - 'tests/**'
      - 'tools/packaged-qa.mjs'
      - 'package*.json'
      - 'vite.config.mjs'
      - 'playwright.config.mjs'
      - 'index.html'
      - '.github/workflows/windows-check.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: npm run package:win
      - run: node tools/packaged-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-check-evidence
          path: |
            docs/ui-test-results.json
            docs/packaged-windows-test-results.json
            docs/screenshots/packaged-windows.png
            test-results/
          retention-days: 14
